services:
  app:
    image: ghcr.io/achaneks/bouathmane-location:latest
    container_name: bouathmane-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: bouathmane-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: bouathmane-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  pgdata:
