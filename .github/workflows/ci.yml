name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Required before typecheck/lint/test: src/generated/prisma is
      # gitignored (it's generated code), and our test suite imports the
      # real generated enums, so it must exist before anything else runs.
      - run: npx prisma generate

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
